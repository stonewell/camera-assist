name: CI Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality-gate:
    name: Rust & Shared Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> core/target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Rust Code Formatting
        run: cargo fmt --check
        working-directory: core

      - name: Clippy Linter Check
        run: cargo clippy --workspace --benches --tests -- -D warnings
        working-directory: core

      - name: Run All Workspace Tests
        run: cargo test --workspace
        working-directory: core

      - name: Run Golden Vectors Regression
        run: cargo test -p compose-core --test golden_runner
        working-directory: core

      - name: Run Microbenchmarks SLA Verification
        run: cargo bench --workspace -- --test
        working-directory: core

      - name: Audit Desktop ONNX Models & Licenses
        run: python3 scripts/audit-models.py

      - name: Verify App Clip Architecture & Size Ceiling
        run: python3 scripts/check-appclip-size.py

      - name: Swift Package Parity & Unit Tests
        run: ./scripts/run-swift-tests.sh

      - name: Audit Desktop Image Decoders (Spike R3)
        run: python3 scripts/audit-image-decoders.py

      - name: Evaluate 24MP Capture Quality SLA (Spike #1)
        run: python3 scripts/evaluate-capture-quality.py --self-test

      - name: Build XCFramework Artifacts (macOS only)
        if: matrix.os == 'macos-14'
        run: ./scripts/build-xcframework.sh

  license-audit:
    name: Cargo-Deny License & Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
