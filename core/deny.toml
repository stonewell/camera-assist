# cargo-deny configuration for Camera Assist core Rust workspace
# See https://embarkstudios.github.io/cargo-deny/ for syntax documentation.

[advisories]
ignore = []
# Fail only if workspace crates are unmaintained; allow transitive dependencies
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "ISC",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
